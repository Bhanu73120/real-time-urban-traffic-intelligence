
services:
  # ==========================================
  # KAFKA
  # ==========================================

  kafka:
    image: apache/kafka:4.1.0
    container_name: traffic-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3


  # ==========================================
  # MINIO DATA LAKE
  # ==========================================
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: traffic-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - traffic_minio_data:/data

  # ==========================================
  # POSTGRESQL ANALYTICS DATABASE
  # ==========================================
  postgres:
    image: postgres:16
    container_name: traffic-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: traffic_analytics

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - traffic_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # DBT TRANSFORMATIONS
  # ==========================================
  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile

    container_name: traffic-dbt
    working_dir: /app

    volumes:
      - ./dbt/traffic_dbt:/app

    environment:
      DBT_PROFILES_DIR: /app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - tools

  # ==========================================
  # SPARK GOLD LOADER - DAY 16
  # ==========================================
  spark-gold-loader:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: traffic-spark-gold-loader:latest

    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

      TRAFFIC_JDBC_URL: jdbc:postgresql://postgres:5432/traffic_analytics

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    profiles:
      - tools

  # ==========================================
  # AIRFLOW METADATA DATABASE
  # ==========================================
  airflow-postgres:
    image: postgres:16
    container_name: traffic-airflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow

    volumes:
      - traffic_airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # AIRFLOW INITIALIZATION
  # ==========================================
  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    user: "0:0"

    entrypoint: /bin/bash

    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R 50000:0 /opt/airflow/logs
        exec /entrypoint airflow db migrate

    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}

      TRAFFIC_DB_HOST: postgres
      TRAFFIC_DB_PORT: "5432"
      TRAFFIC_DB_NAME: traffic_analytics
      TRAFFIC_DB_USER: traffic_user
      TRAFFIC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    depends_on:
      airflow-postgres:
        condition: service_healthy

    profiles:
      - airflow

  # ==========================================
  # AIRFLOW WEBSERVER
  # ==========================================
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: traffic-airflow-webserver

    command: webserver
    restart: unless-stopped

    environment: *airflow-env

    volumes: *airflow-volumes

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      airflow-postgres:
        condition: service_healthy

    profiles:
      - airflow

  # ==========================================
  # AIRFLOW SCHEDULER
  # ==========================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    user: "0:0"

    container_name: traffic-airflow-scheduler

    command: scheduler
    restart: unless-stopped

    environment: *airflow-env

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      airflow-postgres:
        condition: service_healthy

    profiles:
      - airflow

  # ==========================================
  # STREAMLIT TRAFFIC DASHBOARD
  # ==========================================
  dashboard:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile

    container_name: traffic-dashboard

    restart: unless-stopped

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    depends_on:
      postgres:
        condition: service_healthy

# ==========================================
# PERSISTENT DOCKER VOLUMES
# ==========================================
volumes:
  traffic_minio_data:
  traffic_postgres_data:
  traffic_airflow_postgres_data:
